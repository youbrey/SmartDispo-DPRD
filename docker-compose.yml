services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartdispo
      POSTGRES_USER: smartdispo
      POSTGRES_PASSWORD: smartdispo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdispo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  api:
    build: ./backend
    env_file: .env
    environment:
      SMARTDISPO_TEMPLATE_DIR: /app/templates
      SMARTDISPO_TEMPLATE_UPLOAD_DIR: /app/storage/templates
      SMARTDISPO_GENERATED_DIR: /app/generated
      SMARTDISPO_ATTACHMENT_DIR: /app/storage/attachments
    ports:
      - "8000:8000"
    volumes:
      - ./templates:/app/templates:ro
      - generated_documents:/app/generated
      - attachment_storage:/app/storage/attachments
      - template_storage:/app/storage/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  admin-web:
    build: ./admin-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  generated_documents:
  attachment_storage:
  template_storage:
