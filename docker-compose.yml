services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartdispo
      POSTGRES_USER: smartdispo
      POSTGRES_PASSWORD: smartdispo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdispo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./templates:/app/templates:ro

volumes:
  postgres_data:
